name: CI

on:
    push:
        branches: [main]
    pull_request:

env:
    CARGO_TERM_COLOR: always

jobs:
    lint:
        name: Format, Clippy & Build
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
              with:
                persist-credentials: false

            - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 2026-08-05
              with:
                toolchain: stable
                components: clippy, rustfmt

            - name: Check code formatting
              run: cargo fmt -- --check

            - name: Run clippy
              run: cargo clippy --all-targets --all-features

            - name: Build
              run: cargo build

            - name: Install cargo-hack
              uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b #v2.87.4 https://github.com/taiki-e/install-action/releases/tag/v2.87.4
              with:
                  tool: cargo-hack@0.6.45

            - name: Check each feature on its own
              run: |
                  cargo hack check --each-feature --no-dev-deps
                  cargo hack check --each-feature --all-targets

    test:
        name: Tests
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
              with:
                persist-credentials: false

            - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 2026-08-05
              with:
                toolchain: stable

            - name: Run tests
              run: |
                  cargo test --all-features

    deny:
        name: Cargo deny
        runs-on: ubuntu-latest
        permissions:
            contents: read
        strategy:
            matrix:
                checks:
                    - advisories
                    - bans licenses sources

        continue-on-error: ${{ matrix.checks == 'advisories' }}

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
              with:
                persist-credentials: false

            - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 https://github.com/EmbarkStudios/cargo-deny-action/releases/tag/v2.1.1
              with:
                  command: check ${{ matrix.checks }}
                  rust-version: stable
                  arguments: --all-features
