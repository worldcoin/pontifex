[package]
license = "MIT"
edition = "2024"
name = "pontifex"
version = "1.2.0"
readme = "README.md"
homepage = "https://docs.rs/pontifex"
repository = "https://github.com/worldcoin/pontifex"
authors = [
    "Miguel Piedrafita <rust@miguel.build>",
    "Paolo D'Amico <paolodamico@users.noreply.github.com>",
]
keywords = ["aws", "amazon", "enclave", "nitro", "attestation"]
categories = ["cryptography", "hardware-support", "development-tools::ffi"]
description = "An abstraction for building and interacting with AWS Nitro enclaves."

[features]
default=["http"]
client = ["dep:tokio-vsock", "dep:rmp-serde"]
server = ["tokio/rt", "dep:tokio-vsock", "dep:rmp-serde"]
nsm = ["nsm-types", "aws-nitro-enclaves-nsm-api/nix", "tokio/sync", "dep:sha2"]
nsm-types = [
    "dep:coset",
    "dep:ciborium",
    "dep:serde_bytes",
    "dep:aws-nitro-enclaves-nsm-api",
]
http = ["_vsock-https"]
channel = [
    "dep:sha2",
    "dep:quantum-box",
    "dep:zeroize",
]
kms = [
    "_vsock-https",
    "dep:aws-types",
    "dep:aws-sdk-kms",
    "dep:aws-smithy-types",
    "dep:aws-smithy-runtime-api",
]

# Provides client-side functionality to verify the attestation documents
# from Nitro.
verify = [
    "nsm-types",
    "dep:sha2",
    "dep:p384",
    "dep:webpki",
    "dep:x509-cert",
]

# Internal: The HTTPS-over-vsock transport, shared by `http` and `kms`.
_vsock-https = [
    "dep:tokio-vsock",
    "dep:hyper",
    "dep:rustls",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:tower-service",
    "tokio/time",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
const-fnv1a-hash = "1"
serde = "1"
tracing = "0.1"
thiserror = "2"
rmp-serde = { version = "1", optional = true }
tokio-vsock = { version = "0.7", optional = true }
tokio = { version = "1", features = ["io-util"] }
aws-types = { version = "1", optional = true }
serde_bytes = { version = "0.11", optional = true }
tower-service = { version = "0.3", optional = true }
hyper = { version = "1", features = ["client"], optional = true }
aws-smithy-types = { version = "1.3", features = ["http-body-1-x"], optional = true }
aws-nitro-enclaves-nsm-api = { version = "0.4", optional = true, default-features = false }
aws-smithy-runtime-api = { version = "1.9", features = ["client", "http-1x"], optional = true }
aws-sdk-kms = { version = "1.72.0", optional = true, default-features = false, features = [
    "rt-tokio",
] }
hyper-util = { version = "0.1.20", optional = true, default-features = false, features = [
    "client-legacy",
    "http1",
    "http2",
    "tokio",
] }
hyper-rustls = { version = "0.27.9", optional = true, default-features = false, features = [
    "http1",
    "http2",
    "logging",
    "ring",
    "tls12",
    "webpki-tokio",
] }
rustls = { version = "0.23", optional = true, default-features = false, features = [
    "logging",
    "ring",
    "std",
    "tls12",
] }
coset = { version = "0.4", optional = true }
ciborium = { version = "0.2", optional = true }
webpki = { version = "0.22", optional = true }
x509-cert = { version = "0.2", optional = true }
sha2 = { version = "0.10", optional = true }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "sha384"], optional = true }
quantum-box = { version = "0.1", optional = true }
zeroize = { version = "1", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
base64 = "0.22"
tokio-test = "0.4"
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
aws-smithy-runtime-api = { version = "1.9", features = ["client", "http-1x", "test-util"] }
hex-literal = "1"
