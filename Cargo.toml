[package]
license = "MIT"
edition = "2024"
name = "pontifex"
version = "1.1.2"
readme = "README.md"
homepage = "https://docs.rs/pontifex"
repository = "https://github.com/worldcoin/pontifex"
authors = [
    "Miguel Piedrafita <rust@miguel.build>",
    "Paolo D'Amico <paolodamico@users.noreply.github.com>",
]
keywords = ["aws", "amazon", "enclave", "nitro", "attestation"]
categories = ["cryptography", "hardware-support", "development-tools::ffi"]
description = "An abstraction for building and interacting with AWS Nitro enclaves."

[features]
default=["http"]
client = []
server = ["tokio/rt"]
nsm = ["nsm-types", "aws-nitro-enclaves-nsm-api/nix", "tokio/sync"]
nsm-types = [
    "dep:sha2",
    "dep:serde_cbor",
    "dep:serde_bytes",
    "dep:aws-nitro-enclaves-cose",
    "dep:aws-nitro-enclaves-nsm-api",
]
http = ["_vsock-https"]
kms = [
    "_vsock-https",
    "dep:aws-types",
    "dep:aws-sdk-kms",
    "dep:aws-smithy-types",
    "dep:aws-smithy-runtime-api",
]
# The HTTPS-over-vsock transport, shared by `http` and `kms`.
_vsock-https = [
    "dep:hyper",
    "dep:rustls",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:tower-service",
    "tokio/time",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
serde = "1"
tracing = "0.1"
rmp-serde = "1"
thiserror = "2"
tokio-vsock = "0.7"
sha2 = { version = "0.10", optional = true }
aws-types = { version = "1", optional = true }
tokio = { version = "1", features = ["io-util"] }
serde_bytes = { version = "0.11", optional = true }
tower-service = { version = "0.3", optional = true }
hyper = { version = "1.7", features = ["client"], optional = true }
serde_cbor = { version = "0.11", default-features = false, optional = true }
aws-smithy-types = { version = "1.3", features = ["http-body-1-x"], optional = true }
aws-nitro-enclaves-cose = { version = "0.5", optional = true, default-features = false }
aws-nitro-enclaves-nsm-api = { version = "0.4", optional = true, default-features = false }
aws-smithy-runtime-api = { version = "1.9", features = ["client", "http-1x"], optional = true }
aws-sdk-kms = { version = "1.72.0", optional = true, default-features = false, features = [
    "rt-tokio",
] }
hyper-util = { version = "0.1.20", optional = true, default-features = false, features = [
    "client-legacy",
    "http1",
    "http2",
    "tokio",
] }
hyper-rustls = { version = "0.27.9", optional = true, default-features = false, features = [
    "http1",
    "http2",
    "logging",
    "ring",
    "tls12",
    "webpki-tokio",
] }
rustls = { version = "0.23", optional = true, default-features = false, features = [
    "logging",
    "ring",
    "std",
    "tls12",
] }
const-fnv1a-hash = "1.1.0"

[dev-dependencies]
tokio-test = "0.4"
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
aws-smithy-runtime-api = { version = "1.9", features = ["client", "http-1x", "test-util"] }
